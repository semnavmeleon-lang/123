; Скопируйте в config.ini и заполните. config.ini с паролем не коммитьте!

[mail]
; Откуда брать письма:
;   imap    — по IMAP (ниже host/user/password);
;   outlook — прямо из установленного на этом Windows-компьютере классического Outlook (COM).
;             Пароль и host не нужны. Это то, что надо для корпоративного Outlook / Microsoft 365,
;             где вход по IMAP с паролем обычно запрещён администратором.
backend = imap

; --- только для backend = imap ---
; IMAP-серверы популярных сервисов:
;   Gmail      imap.gmail.com      (нужен «пароль приложения», включите IMAP в настройках)
;   Яндекс     imap.yandex.ru      (пароль приложения)
;   Mail.ru    imap.mail.ru        (пароль для внешних приложений)
;   Outlook    outlook.office365.com
host = imap.example.com
port = 993
ssl = yes
user = you@example.com
; Лучше не писать пароль здесь, а задать переменную окружения MAIL_PASSWORD.
password =
; Папка «Отправленные». Пусто = определить автоматически (по флагу \Sent или по стандартным именам).
sent_folder =

[output]
; Имя принтера ТОЧНО как в системе (Linux/macOS: lpstat -p ; Windows: Параметры -> Принтеры).
; Пусто = не печатать, только сохранять PDF в output_dir.
printer = PDF
; Папка, куда дополнительно сохранять PDF (пусто = не сохранять копии).
output_dir = pdf_out
; Команда печати. Пусто = по умолчанию:
;   Linux/macOS:  lp -d {printer} -t {title} {file}
;   Windows:      SumatraPDF -print-to {printer} -silent {file}   (SumatraPDF должен быть установлен)
; Доступные подстановки: {printer} {file} {title}
print_cmd =
state_file = state.json
; Как часто проверять ящик в режиме --watch, сек.
poll_seconds = 60
; Загружать ли картинки с интернета (по умолчанию нет: быстрее и без трекинг-пикселей).
; Картинки, вложенные в само письмо, попадают в PDF в любом случае.
load_remote_images = no
; Чем делать PDF. Пусто = браузер Playwright (нужен `playwright install chromium`).
; На корпоративном Windows проще всего:  browser_path = msedge   (Edge уже установлен, ничего скачивать не надо)
; Можно также chrome или полный путь к chrome.exe / msedge.exe.
browser_path =
