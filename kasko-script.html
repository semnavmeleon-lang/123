<title>Скрипт обзвона КАСКО</title>
<style>
  :root {
    --bg: #f3f5fa;
    --card: #ffffff;
    --border: #e0e4ee;
    --text: #1c2130;
    --text-muted: #656c7a;
    --primary: #2a6fdb;
    --primary-dark: #1f57ad;
    --primary-bg: #eaf1fd;
    --option-bg: #f7f8fb;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 32px 20px 60px;
    line-height: 1.5;
  }
  .page { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }

  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  button.nav {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
  }
  button.nav:hover { border-color: var(--primary); color: var(--primary-dark); }
  button.nav:disabled { opacity: .4; cursor: default; }
  button.nav:disabled:hover { border-color: var(--border); color: var(--text-muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
  }

  .line { font-size: 16px; margin: 0 0 20px; }
  .line .ph { background: var(--primary-bg); color: var(--primary-dark); padding: 1px 5px; border-radius: 4px; font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .optionBtn {
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 13px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--option-bg);
    color: var(--text);
  }
  .optionBtn:hover { border-color: var(--primary); background: var(--primary-bg); color: var(--primary-dark); }

  .done { font-size: 13.5px; color: var(--text-muted); margin: 0; }
</style>

<div class="page">
  <h1>Скрипт обзвона КАСКО</h1>
  <div class="controls">
    <button class="nav" id="btnBack">← Назад</button>
    <button class="nav" id="btnRestart">Начать заново</button>
  </div>
  <div class="card" id="panel"></div>
</div>

<script>
(function () {
  var NODES = {
    start: {
      text: "Добрый день, [[Имя Отчество]]! Меня зовут [[Имя оператора]], я специалист компании ВСК. Ваш полис КАСКО на автомобиль [[марка/модель]] заканчивается [[дата окончания]] — звоню обсудить условия продления. Уделите пару минут, сейчас удобно?",
      options: [
        { label: "Да, удобно, слушаю", next: "confirm_data" },
        { label: "Не могу сейчас говорить", next: "busy" },
        { label: "А кто вы и откуда у вас мои данные?", next: "trust" },
        { label: "Мне это неинтересно, не звоните", next: "hard_refuse_early" },
        { label: "Вы ошиблись, это не тот человек", next: "neg_wrong_person" },
        { label: "Вы уже звонили, я отказывался(-ась)", next: "neg_previous_refusal" }
      ]
    },
    busy: {
      text: "Понимаю, [[Имя Отчество]]. Когда вам удобнее вернуться к разговору — сегодня во второй половине дня или завтра в первой?",
      options: [
        { label: "Хорошо, перезвоните в это время", next: "closing_soft" },
        { label: "Вообще не звоните мне больше", next: "neg_categorical" }
      ]
    },
    trust: {
      text: "Отвечу конкретно: вы клиент ВСК, у вас оформлен полис КАСКО на автомобиль [[марка/модель]], он заканчивается [[дата]] — я как раз по этому вопросу. Если хотите убедиться, что звонок от ВСК, можете самостоятельно перезвонить на номер, указанный на сайте vsk.ru. И сразу уточню: я никогда не спрошу у вас номер карты, CVV-код или код из смс — этого не делает ни один сотрудник страховой компании.",
      options: [
        { label: "Хорошо, понятно, слушаю вас", next: "confirm_data" },
        { label: "Всё равно не звоните мне", next: "neg_categorical" },
        { label: "Мне всё ещё не спокойно, перезвоню сам(а)", next: "closing_soft" }
      ]
    },
    hard_refuse_early: {
      text: "Понимаю. Тогда буквально коротко: ваш полис КАСКО заканчивается [[дата]], и без продления с этой даты автомобиль останется без защиты. Если сейчас неактуально — подскажите день, когда вернуться к разговору, чтобы не упустить срок?",
      options: [
        { label: "Хорошо, давайте коротко", next: "confirm_data" },
        { label: "Нет, спасибо, продлевать не буду", next: "neg_categorical" },
        { label: "Грубо требует закончить разговор", next: "neg_aggressive" }
      ]
    },
    neg_wrong_person: {
      text: "Понял(а), значит данные в базе устарели — передам на уточнение. Хорошего дня!"
    },
    neg_previous_refusal: {
      text: "По данным вижу, что ранее уже был отказ от продления. Уточните, пожалуйста: ситуация как-то изменилась, или звонок неактуален и мне стоит завершить разговор?",
      options: [
        { label: "Да, ситуация изменилась, слушаю", next: "confirm_data" },
        { label: "Нет, актуальность та же, не звоните", next: "neg_categorical" }
      ]
    },

    confirm_data: {
      text: "Сверим данные: автомобиль [[марка/модель]] тот же, изменений по допущенным водителям не было? И подскажите, были ли за этот год страховые случаи?",
      options: [
        { label: "Всё то же самое, случаев не было", next: "sum_discussion" },
        { label: "Есть изменения (автомобиль/водители)", next: "sum_discussion" },
        { label: "Был страховой случай", next: "claims_review" },
        { label: "Пока не уверен(а), что буду продлевать", next: "renewal_hesitation" }
      ]
    },
    claims_review: {
      text: "Расскажите, пожалуйста, как прошло урегулирование — устроили сроки рассмотрения, размер выплаты и качество ремонта?",
      options: [
        { label: "В целом всё устроило", next: "sum_discussion" },
        { label: "Были нарекания", next: "neg_bad_experience" }
      ]
    },
    renewal_hesitation: {
      text: "Подскажите, что именно вызывает сомнение: цена продления, опыт по страховому случаю, если он был, или, может быть, рассматриваете предложения других страховых компаний на этот год?",
      options: [
        { label: "В основном цена выросла", next: "price_objection" },
        { label: "Рассматриваю другие страховые компании", next: "retention" },
        { label: "Не понравилось, как прошла выплата", next: "neg_bad_experience" },
        { label: "Ладно, готов(а) продлевать", next: "sum_discussion" }
      ]
    },

    retention: {
      text: "Понимаю, сравнить предложения — разумно. За время с нами уже сложилась история: оформленные документы, при необходимости — опыт урегулирования, привычные контакты, и никакого перерыва в защите, который возникает при смене страховщика. Что именно предлагают другие компании — более низкую цену или другие условия?",
      options: [
        { label: "В основном дешевле", next: "price_objection" },
        { label: "Пришлю предложение, сравните", next: "compare_offer" },
        { label: "А чем вы лучше?", next: "value_claims" },
        { label: "Я уже решил(а) переходить в другую компанию", next: "retention_lost" }
      ]
    },
    compare_offer: {
      text: "Пришлите, пожалуйста, предложение конкурента — сравню условия и отвечу честно, можем ли мы предложить сопоставимый или лучший вариант. Успею подготовить ответ до [[дата окончания полиса]]?",
      options: [
        { label: "Хорошо, отправлю и жду ответа", next: "closing_soft" },
        { label: "Ладно, не буду сравнивать, продлеваем сейчас", next: "sum_discussion" }
      ]
    },
    value_claims: {
      text: "Тогда обращу внимание на несколько моментов сервиса ВСК, которые уже действуют по вашему договору и сохранятся при продлении: круглосуточный колл-центр с информированием о статусе урегулирования на каждом этапе, ремонт на дилере или в сети мультисервиса по направлению страховщика, а по ряду повреждений — например, сколы и трещины стёкол — выплата без сбора справок.",
      options: [
        { label: "Хорошо, буду продлевать", next: "sum_discussion" },
        { label: "Всё равно рассматриваю другие варианты", next: "retention_lost" }
      ]
    },
    retention_lost: {
      text: "Понимаю, решение за вами. Если планы изменятся до [[дата окончания полиса]] — буду на связи, обсудим варианты ещё раз. Спасибо за время, хорошего дня!"
    },

    price_objection: {
      text: "Понимаю, цена — важный фактор. На стоимость продления могли повлиять несколько причин: общее изменение тарифов, статистика убыточности за год, изменение стоимости самого автомобиля. Можно снизить сумму за счёт франшизы, перейти на продукт с более узким набором рисков, либо, если это предусмотрено продуктом, оформить рассрочку. Соберём вариант под ваш бюджет?",
      options: [
        { label: "Хорошо, пересчитайте", next: "sum_discussion" },
        { label: "Какие есть варианты подешевле?", next: "downgrade_options" },
        { label: "Всё равно дороже, чем предлагают другие", next: "retention" },
        { label: "Нужно подумать", next: "neg_thinking" }
      ]
    },
    downgrade_options: {
      text: "Если приоритет — снизить стоимость, есть более точечные продукты: «Компакт» — защита при ДТП по вине установленных третьих лиц, угон — опцией, дешевле «Классики» до 80%; «Компакт минимум» — защита от виновников без ОСАГО, дешевле до 95%, без осмотра; «Компакт фикс» — похожий продукт, оформляется вместе с ОСАГО. Любой из них заметно снизит сумму по сравнению с текущим пакетом.",
      options: [
        { label: "Подходит, пересчитайте", next: "sum_discussion" },
        { label: "Всё равно дорого, продлевать не буду", next: "neg_dont_need" }
      ]
    },

    sum_discussion: {
      text: "Уточните: сохраняем страховую сумму на уровне прошлого года или пересматриваем по текущей стоимости автомобиля? Рассматриваете франшизу для снижения стоимости? И как удобнее оплатить — единовременно или, если продукт предусматривает, в рассрочку?",
      options: [
        { label: "Готов(а) продлевать, условия устраивают", next: "closing_success" },
        { label: "Нужно подумать / посоветоваться", next: "neg_thinking" },
        { label: "Дороговато, есть варианты подешевле?", next: "price_after_calc" },
        { label: "А можно скидку больше заявленной?", next: "discount_demand" },
        { label: "Изменилось использование авто (такси/каршеринг)", next: "neg_ineligible" }
      ]
    },
    price_after_calc: {
      text: "Можно снизить стоимость несколькими способами: увеличить франшизу, выбрать продукт с более узким набором рисков — например, вместо «Классики» рассмотреть «Компакт плюс» или «Компакт», — либо, если это применимо к продукту, оформить рассрочку. Давайте посмотрим, какой вариант подойдёт именно вам.",
      options: [
        { label: "Хорошо, пересчитайте с франшизой/другим продуктом", next: "sum_discussion" },
        { label: "Всё равно дорого, не готов(а)", next: "neg_thinking" },
        { label: "Нет, спасибо, не буду оформлять", next: "closing_hard" }
      ]
    },
    discount_demand: {
      text: "Скидка по продукту фиксированная и указана в условиях — назначить её выше вручную я не могу, это вне моей компетенции. Но можно скорректировать итоговую стоимость через франшизу или выбор другого продукта линейки, если бюджет — приоритет.",
      options: [
        { label: "Ладно, давайте через франшизу", next: "sum_discussion" },
        { label: "Тогда соедините с руководителем", next: "escalate" },
        { label: "Не буду оформлять", next: "closing_hard" }
      ]
    },
    escalate: {
      text: "Хорошо, я передам ваш номер и запрос руководителю отдела, он свяжется с вами дополнительно. Уточните, пожалуйста, удобное время для звонка."
    },

    neg_categorical: {
      text: "Понял(а) вас, спасибо за время. Уважаю ваше решение — больше не будем связываться по этому вопросу. Хорошего дня!"
    },
    neg_dont_need: {
      text: "Понимаю, спасибо, что уделили время. Если решите вернуться — контакты ВСК есть в открытом доступе на сайте vsk.ru. Хорошего дня!"
    },
    neg_bad_experience: {
      text: "Мне жаль это слышать, и понятно, почему это повлияло на отношение к страхованию в целом. Расскажите, пожалуйста, что произошло — если это касалось ВСК, я передам информацию в соответствующий отдел, а если другой компании, поясню, чем наш подход к урегулированию отличается.",
      options: [
        { label: "Ладно, расскажу подробнее", next: "value_claims" },
        { label: "Не хочу это обсуждать, просто не интересно", next: "neg_dont_need" }
      ]
    },
    neg_thinking: {
      text: "Конечно, это разумно. Чтобы было удобнее принять решение, отправлю краткие условия предложения — на почту или в WhatsApp, как удобнее. Когда можно перезвонить, чтобы уточнить решение — через два-три дня?",
      options: [
        { label: "Хорошо, договорились", next: "closing_soft" },
        { label: "Не нужно перезванивать, я сам(а) свяжусь", next: "closing_soft" }
      ]
    },
    neg_aggressive: {
      text: "Понимаю ваше раздражение. Заканчиваю звонок, чтобы не усугублять — хорошего дня."
    },
    neg_ineligible: {
      text: "По формальным условиям продукта, к сожалению, не смогу продлить полис на прежних условиях: [[уточнить причину — начали использовать как такси/каршеринг/доставку, изменилось число собственников, техническая неисправность]]. Уточню, какие варианты в вашем случае вообще возможны, и вернусь с ответом."
    },

    closing_success: {
      text: "Отлично, оформляем продление. Данные по автомобилю и допущенным водителям у нас уже есть — пришлите только то, что изменилось: [[новые ВУ/СТС и т.п., если менялись]]. На какой номер или почту отправить реквизиты для оплаты и подтверждение?"
    },
    closing_soft: {
      text: "Хорошо, [[Имя Отчество]], тогда договорились — жду вашего решения [[дата/канал]]. Спасибо за время, хорошего дня!"
    },
    closing_hard: {
      text: "Понимаю, спасибо, что уделили время на разговор. Хорошего дня!"
    }
  };

  var history = ["start"];

  function currentId() { return history[history.length - 1]; }

  function renderText(t) {
    return t.replace(/\[\[([^\]]+)\]\]/g, '<span class="ph">$1</span>');
  }

  function goTo(id) {
    if (!NODES[id]) return;
    history.push(id);
    render();
  }
  function goBack() {
    if (history.length > 1) { history.pop(); render(); }
  }
  function restart() {
    history = ["start"];
    render();
  }

  function render() {
    var node = NODES[currentId()];
    var el = document.getElementById("panel");
    el.innerHTML = "";

    var line = document.createElement("p");
    line.className = "line";
    line.innerHTML = renderText(node.text);
    el.appendChild(line);

    if (node.options && node.options.length) {
      var opts = document.createElement("div");
      opts.className = "options";
      node.options.forEach(function (opt) {
        var b = document.createElement("button");
        b.className = "optionBtn";
        b.textContent = opt.label;
        b.addEventListener("click", function () { goTo(opt.next); });
        opts.appendChild(b);
      });
      el.appendChild(opts);
    } else {
      var done = document.createElement("p");
      done.className = "done";
      done.textContent = "Звонок завершён.";
      el.appendChild(done);
    }

    document.getElementById("btnBack").disabled = history.length <= 1;
  }

  document.getElementById("btnBack").addEventListener("click", goBack);
  document.getElementById("btnRestart").addEventListener("click", restart);

  render();
})();
</script>
