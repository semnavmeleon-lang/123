<title>Скрипт обзвона КАСКО</title>
<style>
  :root {
    --bg: #f3f5fa;
    --card: #ffffff;
    --border: #e0e4ee;
    --text: #1c2130;
    --text-muted: #656c7a;
    --primary: #2a6fdb;
    --primary-dark: #1f57ad;
    --primary-bg: #eaf1fd;
    --option-bg: #f7f8fb;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 32px 20px 60px;
    line-height: 1.5;
  }
  .page { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }

  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  button.nav {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
  }
  button.nav:hover { border-color: var(--primary); color: var(--primary-dark); }
  button.nav:disabled { opacity: .4; cursor: default; }
  button.nav:disabled:hover { border-color: var(--border); color: var(--text-muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
  }

  .line { font-size: 16px; margin: 0 0 20px; }
  .line .ph { background: var(--primary-bg); color: var(--primary-dark); padding: 1px 5px; border-radius: 4px; font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .optionBtn {
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 13px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--option-bg);
    color: var(--text);
  }
  .optionBtn:hover { border-color: var(--primary); background: var(--primary-bg); color: var(--primary-dark); }

  .done { font-size: 13.5px; color: var(--text-muted); margin: 0; }
</style>

<div class="page">
  <h1>Скрипт обзвона КАСКО</h1>
  <div class="controls">
    <button class="nav" id="btnBack">← Назад</button>
    <button class="nav" id="btnRestart">Начать заново</button>
  </div>
  <div class="card" id="panel"></div>
</div>

<script>
(function () {
  var NODES = {
    start: {
      text: "Добрый день, [[Имя Отчество]]! Меня зовут [[Имя оператора]], я специалист компании ВСК. Ваш полис КАСКО на автомобиль [[марка/модель]] заканчивается [[дата окончания]] — звоню обсудить условия продления.",
      options: [
        { label: "Да, удобно, слушаю", next: "confirm_data" },
        { label: "Не могу сейчас говорить", next: "busy" },
        { label: "А кто вы и откуда у вас мои данные?", next: "trust" },
        { label: "Мне это неинтересно, не звоните", next: "hard_refuse_early" },
        { label: "Вы ошиблись, это не тот человек", next: "neg_wrong_person" },
        { label: "Вы уже звонили, я отказывался(-ась)", next: "neg_previous_refusal" }
      ]
    },
    busy: {
      text: "Понимаю, [[Имя Отчество]]. Когда вам удобнее вернуться к разговору — сегодня во второй половине дня или завтра в первой?",
      options: [
        { label: "Хорошо, перезвоните в это время", next: "closing_soft" },
        { label: "Вообще не звоните мне больше", next: "neg_categorical" }
      ]
    },
    trust: {
      text: "Отвечу конкретно: вы клиент ВСК, полис КАСКО на [[марка/модель]] заканчивается [[дата]] — звоню по этому вопросу. Можете перезвонить на номер с сайта vsk.ru, чтобы убедиться. И ещё: я никогда не спрошу номер карты, CVV-код или код из смс — это делает только мошенник.",
      options: [
        { label: "Хорошо, понятно, слушаю вас", next: "confirm_data" },
        { label: "Всё равно не звоните мне", next: "neg_categorical" },
        { label: "Мне всё ещё не спокойно, перезвоню сам(а)", next: "closing_soft" }
      ]
    },
    hard_refuse_early: {
      text: "Понимаю. Коротко: полис КАСКО заканчивается [[дата]] — без продления с этой даты автомобиль без защиты. Если сейчас неактуально, назовите день, когда вернуться к разговору.",
      options: [
        { label: "Хорошо, давайте коротко", next: "confirm_data" },
        { label: "Нет, спасибо, продлевать не буду", next: "neg_categorical" },
        { label: "Грубо требует закончить разговор", next: "neg_aggressive" }
      ]
    },
    neg_wrong_person: {
      text: "Понял(а), данные в базе устарели — передам на исправление. Хорошего дня!"
    },
    neg_previous_refusal: {
      text: "По данным вижу, что ранее уже был отказ от продления. Ситуация изменилась, или звонок неактуален?",
      options: [
        { label: "Да, ситуация изменилась, слушаю", next: "confirm_data" },
        { label: "Нет, актуальность та же, не звоните", next: "neg_categorical" }
      ]
    },

    confirm_data: {
      text: "Сверим данные: автомобиль [[марка/модель]] тот же, водители те же? И были ли за год страховые случаи?",
      options: [
        { label: "Всё то же самое, случаев не было", next: "sum_discussion" },
        { label: "Есть изменения (автомобиль/водители)", next: "sum_discussion" },
        { label: "Был страховой случай", next: "claims_review" },
        { label: "Пока не уверен(а), что буду продлевать", next: "renewal_hesitation" }
      ]
    },
    claims_review: {
      text: "Как прошло урегулирование — сроки, выплата, ремонт устроили?",
      options: [
        { label: "В целом всё устроило", next: "sum_discussion" },
        { label: "Были нарекания", next: "neg_bad_experience" }
      ]
    },
    renewal_hesitation: {
      text: "Что именно вызывает сомнение: цена, опыт по страховому случаю, если он был, или смотрите предложения других компаний?",
      options: [
        { label: "В основном цена выросла", next: "price_objection" },
        { label: "Рассматриваю другие страховые компании", next: "retention" },
        { label: "Не понравилось, как прошла выплата", next: "neg_bad_experience" },
        { label: "Ладно, готов(а) продлевать", next: "sum_discussion" }
      ]
    },

    retention: {
      text: "Понимаю. У нас уже есть история: документы оформлены, при случае — опыт урегулирования, и никакого перерыва в защите, который возникает при переходе. Что предлагают конкретно — цену или условия?",
      options: [
        { label: "В основном дешевле", next: "price_objection" },
        { label: "Пришлю предложение, сравните", next: "compare_offer" },
        { label: "А чем вы лучше?", next: "value_claims" },
        { label: "Я уже решил(а) переходить в другую компанию", next: "retention_lost" }
      ]
    },
    compare_offer: {
      text: "Пришлите предложение конкурента — сравню и отвечу, есть ли у нас сопоставимый вариант, до [[дата окончания полиса]].",
      options: [
        { label: "Хорошо, отправлю и жду ответа", next: "closing_soft" },
        { label: "Ладно, не буду сравнивать, продлеваем сейчас", next: "sum_discussion" }
      ]
    },
    value_claims: {
      text: "У вас уже подключено и сохранится при продлении: круглосуточный колл-центр со статусом урегулирования на каждом этапе, ремонт на дилере или в мультисервисе, а сколы и трещины стёкол — выплата без справок.",
      options: [
        { label: "Хорошо, буду продлевать", next: "sum_discussion" },
        { label: "Всё равно рассматриваю другие варианты", next: "retention_lost" }
      ]
    },
    retention_lost: {
      text: "Понимаю, решение за вами. Если планы изменятся до [[дата окончания полиса]] — на связи, обсудим ещё раз. Хорошего дня!"
    },

    price_objection: {
      text: "Понимаю. Снизить можно франшизой, более узким пакетом рисков или рассрочкой. Что рассмотрим?",
      options: [
        { label: "Хорошо, пересчитайте", next: "sum_discussion" },
        { label: "Какие есть варианты подешевле?", next: "downgrade_options" },
        { label: "Всё равно дороже, чем предлагают другие", next: "retention" },
        { label: "Нужно подумать", next: "neg_thinking" }
      ]
    },
    downgrade_options: {
      text: "Дешевле — продукт «Компакт»: до 80% от «Классики», покрывает ДТП по вине установленных третьих лиц, угон опцией. Пересчитать на нём?",
      options: [
        { label: "Подходит, пересчитайте", next: "sum_discussion" },
        { label: "Всё равно дорого, продлевать не буду", next: "neg_dont_need" }
      ]
    },

    sum_discussion: {
      text: "Продлеваем на текущих условиях: сумма по актуальной стоимости автомобиля, риски без изменений. Оплата сразу или в рассрочку?",
      options: [
        { label: "Готов(а) продлевать, условия устраивают", next: "closing_success" },
        { label: "Нужно подумать / посоветоваться", next: "neg_thinking" },
        { label: "Дороговато, есть варианты подешевле?", next: "price_after_calc" },
        { label: "А можно скидку больше заявленной?", next: "discount_demand" },
        { label: "Изменилось использование авто (такси/каршеринг)", next: "neg_ineligible" }
      ]
    },
    price_after_calc: {
      text: "Можно снизить: франшизой, более узким пакетом рисков (например, «Компакт»), или рассрочкой. Что рассмотрим?",
      options: [
        { label: "Хорошо, пересчитайте с франшизой/другим продуктом", next: "sum_discussion" },
        { label: "Всё равно дорого, не готов(а)", next: "neg_thinking" },
        { label: "Нет, спасибо, не буду оформлять", next: "closing_hard" }
      ]
    },
    discount_demand: {
      text: "Скидка фиксированная, выше назначить не могу — не в моей компетенции. Могу скорректировать цену франшизой или другим продуктом — что предпочтёте?",
      options: [
        { label: "Ладно, давайте через франшизу", next: "sum_discussion" },
        { label: "Тогда соедините с руководителем", next: "escalate" },
        { label: "Не буду оформлять", next: "closing_hard" }
      ]
    },
    escalate: {
      text: "Передам номер и запрос руководителю, он свяжется дополнительно. Когда удобно позвонить?"
    },

    neg_categorical: {
      text: "Понял(а). Больше не будем связываться по этому вопросу. Хорошего дня!"
    },
    neg_dont_need: {
      text: "Понимаю. Если решите вернуться — контакты ВСК на сайте vsk.ru. Хорошего дня!"
    },
    neg_bad_experience: {
      text: "Понятно. Расскажите, что произошло — если это касалось ВСК, передам в отдел; если другой компании, покажу, чем наш подход к урегулированию отличается.",
      options: [
        { label: "Ладно, расскажу подробнее", next: "value_claims" },
        { label: "Не хочу это обсуждать, просто не интересно", next: "neg_dont_need" }
      ]
    },
    neg_thinking: {
      text: "Отправлю условия на почту или в WhatsApp. Когда перезвонить — через два-три дня?",
      options: [
        { label: "Хорошо, договорились", next: "closing_soft" },
        { label: "Не нужно перезванивать, я сам(а) свяжусь", next: "closing_soft" }
      ]
    },
    neg_aggressive: {
      text: "Понимаю ваше раздражение. Заканчиваю звонок, чтобы не усугублять — хорошего дня."
    },
    neg_ineligible: {
      text: "По условиям продукта на прежних условиях не продлю: [[уточнить причину — начали использовать как такси/каршеринг/доставку, изменилось число собственников, техническая неисправность]]. Уточню, какие варианты возможны, и вернусь с ответом."
    },

    closing_success: {
      text: "Оформляем продление. Пришлите только то, что изменилось: [[новые ВУ/СТС и т.п., если менялись]]. Реквизиты отправить на телефон или почту?"
    },
    closing_soft: {
      text: "[[Имя Отчество]], договорились — перезвоню [[дата/канал]]. Хорошего дня!"
    },
    closing_hard: {
      text: "Хорошего дня!"
    }
  };

  var history = ["start"];

  function currentId() { return history[history.length - 1]; }

  function renderText(t) {
    return t.replace(/\[\[([^\]]+)\]\]/g, '<span class="ph">$1</span>');
  }

  function goTo(id) {
    if (!NODES[id]) return;
    history.push(id);
    render();
  }
  function goBack() {
    if (history.length > 1) { history.pop(); render(); }
  }
  function restart() {
    history = ["start"];
    render();
  }

  function render() {
    var node = NODES[currentId()];
    var el = document.getElementById("panel");
    el.innerHTML = "";

    var line = document.createElement("p");
    line.className = "line";
    line.innerHTML = renderText(node.text);
    el.appendChild(line);

    if (node.options && node.options.length) {
      var opts = document.createElement("div");
      opts.className = "options";
      node.options.forEach(function (opt) {
        var b = document.createElement("button");
        b.className = "optionBtn";
        b.textContent = opt.label;
        b.addEventListener("click", function () { goTo(opt.next); });
        opts.appendChild(b);
      });
      el.appendChild(opts);
    } else {
      var done = document.createElement("p");
      done.className = "done";
      done.textContent = "Звонок завершён.";
      el.appendChild(done);
    }

    document.getElementById("btnBack").disabled = history.length <= 1;
  }

  document.getElementById("btnBack").addEventListener("click", goBack);
  document.getElementById("btnRestart").addEventListener("click", restart);

  render();
})();
</script>
